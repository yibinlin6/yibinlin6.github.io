<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yibin Lin (林熠彬)</title>
  <meta name="description" content="Personal homepage of Yibin Lin." />

  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/images/favicon-32x32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-180x180.png" />

  <!-- Font Awesome for the contact icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="/style.css" />

  <!-- Apply saved theme + language before paint to avoid a flash -->
  <script>
    (function () {
      var theme = localStorage.getItem("theme");
      if (!theme) {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");

      var lang = localStorage.getItem("lang") || "en";
      document.documentElement.setAttribute("lang", lang);
      document.documentElement.setAttribute("data-lang", lang);
    })();
  </script>
</head>

<body>
  <!-- Top-right controls: language + theme toggle -->
  <div class="controls">
    <button id="lang-toggle" class="control-btn" type="button" aria-label="Switch language">
      <span data-en="中文" data-zh="EN"></span>
    </button>
    <button id="theme-toggle" class="control-btn" type="button" aria-label="Toggle dark mode">
      <i class="fa-solid fa-sun" aria-hidden="true"></i>
    </button>
  </div>

  <div class="layout">

    <!-- ============ LEFT: profile + contact ============ -->
    <aside class="profile">
      <img class="profile__avatar" src="/images/profile.jpg" alt="Yibin Lin" />
      <h1 class="profile__name">Yibin Lin<br /><span class="profile__name-cn">林熠彬</span></h1>
      <p class="profile__bio" data-en="Personal Homepage" data-zh="个人主页"></p>

      <ul class="contact">
        <li>
          <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
          <span data-en="Xi'an, China" data-zh="中国 · 西安"></span>
        </li>
        <li>
          <i class="fa-solid fa-building-columns" aria-hidden="true"></i>
          <span data-en="Xi'an Jiaotong University" data-zh="西安交通大学"></span>
        </li>
        <li>
          <i class="fa-solid fa-envelope" aria-hidden="true"></i>
          <a href="mailto:yibinlin753@gmail.com">yibinlin753@gmail.com</a>
        </li>
        <li>
          <i class="fa-brands fa-weixin" aria-hidden="true"></i>
          <span>WeChat: ssr0082</span>
        </li>
        <li>
          <i class="fa-solid fa-phone" aria-hidden="true"></i>
          <span>18759950082</span>
        </li>
        <li>
          <i class="fa-brands fa-github" aria-hidden="true"></i>
          <a href="https://github.com/yibinlin6">github.com/yibinlin6</a>
        </li>
      </ul>
    </aside>

    <!-- ============ CENTER: main content ============ -->
    <main class="content">

      <section class="card">
        <p class="eyebrow" data-en="About Me" data-zh="关于我"></p>
        <p class="lead" data-en="More about me coming soon." data-zh="个人介绍更新中。"></p>
      </section>

      <section class="card">
        <p class="eyebrow" data-en="Education" data-zh="教育经历"></p>
        <h2 class="card__title" data-en="Academic background" data-zh="学术背景"></h2>

        <div class="edu__identity">
          <img class="edu__logo" src="/images/XJTU_emblem.svg" alt="Xi'an Jiaotong University logo" />
          <div>
            <h3 data-en="Xi'an Jiaotong University" data-zh="西安交通大学"></h3>
            <p data-en="B.S. in Computer Science and Technology" data-zh="计算机科学与技术 学士"></p>
            <p data-en="2023.09 – Present" data-zh="2023.09 – 至今"></p>
          </div>
        </div>

        <div class="edu__identity">
          <img class="edu__logo" src="/images/ZJU_emblem.svg" alt="Zhejiang University logo" />
          <div>
            <h3 data-en="Zhejiang University" data-zh="浙江大学"></h3>
            <p data-en="Ph.D. in Computer Science and Technology" data-zh="计算机科学与技术 博士（直博，待入学）"></p>
            <p data-en="Starting in 2027" data-zh="2027 年入学"></p>
          </div>
        </div>

      </section>

      <section class="card">
        <p class="eyebrow" data-en="Honors" data-zh="荣誉奖项"></p>
        <h2 class="card__title" data-en="Awards and distinctions" data-zh="获奖与荣誉"></h2>
        <p data-en="To be updated." data-zh="待更新。"></p>
      </section>

      <section class="card">
        <p class="eyebrow" data-en="Publications &amp; Projects" data-zh="论文与项目"></p>
        <h2 class="card__title" data-en="Selected work" data-zh="代表性工作"></h2>

        <div class="pub-list">
          <p data-en="To be updated." data-zh="待更新。"></p>
        </div>

      </section>

    </main>

    <!-- ============ RIGHT: blog card ============ -->
    <aside class="blog-col">
      <!-- Blog card temporarily hidden
      <div class="blog-card">
        <p class="eyebrow" data-en="Blog" data-zh="博客"></p>
        <h2 class="blog-card__title" data-en="Nest" data-zh="Nest"></h2>
        <p class="blog-card__lead"
           data-en="My personal blog for notes, technical writing, and life updates."
           data-zh="我的个人博客，记录笔记、技术写作和生活随想。"></p>
        <a class="blog-card__link" href="https://blog-94s.pages.dev" target="_blank" rel="noopener"
           data-en="Visit Blog" data-zh="访问博客"></a>
      </div>
      -->

      <!-- Live weather (Open-Meteo, Xi'an) -->
      <div class="widget" id="weather-widget">
        <p class="eyebrow" data-en="Weather" data-zh="实时天气"></p>
        <div class="widget__weather">
          <span class="widget__weather-icon" id="weather-icon" aria-hidden="true">⏳</span>
          <div>
            <strong class="widget__temp" id="weather-temp">—</strong>
            <span class="widget__weather-desc" id="weather-desc"
                  data-en="Loading…" data-zh="加载中…"></span>
          </div>
        </div>
        <p class="widget__loc" data-en="Xi'an, China" data-zh="中国 · 西安"></p>
      </div>

      <!-- Daily quote (Hitokoto) -->
      <div class="widget" id="quote-widget">
        <p class="eyebrow">
          <span data-en="Daily Quote" data-zh="每日一句"></span>
          <span class="widget__date" id="quote-date"></span>
        </p>
        <blockquote class="widget__quote" id="quote-text"
                    data-en="Loading…" data-zh="加载中…"></blockquote>
        <cite class="widget__quote-from" id="quote-from"></cite>
      </div>
    </aside>

  </div>

  <footer class="site-footer">
    <span data-en="© 2026 Yibin Lin. Built as a static page, hosted on GitHub Pages."
          data-zh="© 2026 林熠彬 · 纯静态页面，托管于 GitHub Pages。"></span>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
